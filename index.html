<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>自定义导航</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI','Microsoft YaHei',Roboto,sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #eef2f7 0%, #f9fcff 100%);
            padding: 80px 20px 60px 20px;
        }
        .nav-app {
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
        }
        .breadcrumb-bar {
            background: rgba(255,255,255,0.7);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 20px;
            margin-bottom: 25px;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .breadcrumb-item {
            cursor: pointer;
            color: #1e6fdf;
            font-weight: 500;
            -webkit-transition: 0.1s;
            transition: 0.1s;
        }
        .breadcrumb-item:hover {
            text-decoration: underline;
        }
        .breadcrumb-sep {
            color: #aaa;
            font-size: 12px;
        }
        .breadcrumb-home {
            font-weight: bold;
        }
        .action-bar {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
        }
        .search-group {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            gap: 12px;
            background: white;
            padding: 4px 8px 4px 20px;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            position: relative;
            z-index: 999999;
        }
        .search-group input {
            width: 380px;
            height: 44px;
            border: none;
            font-size: 15px;
            outline: none;
            background: transparent;
        }
        .search-btn-wrapper {
            position: relative;
        }
        .search-btn {
            background: #1e6fdf;
            border: none;
            border-radius: 40px;
            padding: 0 18px;
            height: 42px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            -webkit-transition: 0.2s;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(30, 111, 223, 0.2);
            display: -webkit-inline-box;
            display: -webkit-inline-flex;
            display: -ms-inline-flexbox;
            display: inline-flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 6px;
        }
        .search-btn:hover {
            background: #0f5bc0;
            -webkit-transform: scale(0.97);
            transform: scale(0.97);
        }
        .search-btn .arrow {
            font-size: 10px;
            -webkit-transform: rotate(0deg) !important;
            transform: rotate(0deg) !important;
        }
        .search-btn-wrapper.open .arrow {
            -webkit-transform: rotate(0deg) !important;
            transform: rotate(0deg) !important;
        }
        .search-dropdown {
            position: absolute;
            top: 110%;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            list-style: none;
            padding: 8px 0;
            min-width: 160px;
            display: none;
            z-index: 99999;
        }
        .search-dropdown li {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            -webkit-transition: background 0.15s;
            transition: background 0.15s;
        }
        .search-dropdown li:hover {
            background: #f0f4ff;
        }
        .search-dropdown li.active {
            color: #1e6fdf;
            font-weight: 600;
        }
        .search-dropdown li.divider {
            border-top: 1px solid #eee;
            margin: 4px 0;
            padding: 0;
            cursor: default;
            height: 1px;
        }
        .search-dropdown li.manage {
            color: #2c3e66;
            border-top: 1px solid #e2e6ea;
            margin-top: 4px;
        }
        .tools-group {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            gap: 12px;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
        }
        .tools-group button {
            background: white;
            border: none;
            padding: 8px 20px;
            border-radius: 32px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            -webkit-transition: 0.2s;
            transition: 0.2s;
            color: #1f2a3e;
            display: -webkit-inline-box;
            display: -webkit-inline-flex;
            display: -ms-inline-flexbox;
            display: inline-flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 6px;
        }
        .tools-group button.primary {
            background: #2c3e66;
            color: white;
            box-shadow: 0 6px 12px rgba(44, 62, 102, 0.2);
        }
        .tools-group button.warning {
            background: #fff2e8;
            color: #c45c1a;
        }
        .tools-group button:hover {
            -webkit-transform: translateY(-2px);
            transform: translateY(-2px);
            background: #eef3fc;
        }
        .back-home-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 32px;
            padding: 8px 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 107, 107, 0.3);
            -webkit-transition: 0.2s;
            transition: 0.2s;
        }
        .back-home-btn:hover {
            background: #e15554;
            -webkit-transform: scale(0.96);
            transform: scale(0.96);
        }
        /* 排序模式退出按钮 */
        .exit-sort-btn {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 32px;
            padding: 8px 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .exit-sort-btn:hover {
            background: #e68900;
            transform: scale(0.96);
        }
        .grid {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            gap: 25px;
            -webkit-box-pack: start;
            -webkit-justify-content: flex-start;
            -ms-flex-pack: start;
            justify-content: flex-start;
        }
        .grid > * {
            width: 90px;
        }
        .card-wrapper {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
        }
        .card {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
            -webkit-transition: -webkit-transform 0.1s ease, box-shadow 0.1s ease;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .card:active {
            -webkit-transform: scale(0.97);
            transform: scale(0.97);
        }
        .card-title {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 90px;
        }
        .card.folder-card {
            background: #fff5e0;
        }
        .card.link-card {
            background: #e8f0fe;
        }
        .empty-tip {
            text-align: center;
            padding: 60px 20px;
            color: #8c9aa8;
            font-size: 1rem;
            background: rgba(255,255,240,0.6);
            border-radius: 48px;
            width: 100%;
        }
        .sortable-drag {
            opacity: 0.4;
        }
        .context-menu {
            position: fixed;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 8px 0;
            min-width: 160px;
            z-index: 10000;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            background-color: rgba(255,255,255,0.96);
            border: 1px solid rgba(0,0,0,0.08);
        }
        .context-menu-item {
            padding: 10px 20px;
            font-size: 14px;
            color: #1f2a3e;
            cursor: pointer;
            -webkit-transition: background 0.1s;
            transition: background 0.1s;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 8px;
        }
        .context-menu-item:hover {
            background: #f0f4ff;
        }
        .context-menu-item.danger {
            color: #e15554;
        }
        .context-menu-divider {
            height: 1px;
            background: #e9ecef;
            margin: 6px 0;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            z-index: 20000;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
        }
        .modal-container {
            background: white;
            border-radius: 24px;
            width: 400px;
            max-width: 90%;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            -webkit-animation: fadeIn 0.15s ease;
            animation: fadeIn 0.15s ease;
        }
        .modal-container h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        .folder-tree {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #e2e6ea;
            border-radius: 12px;
            padding: 8px 0;
        }
        .tree-node {
            padding: 8px 12px;
            cursor: pointer;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 8px;
            -webkit-transition: background 0.1s;
            transition: background 0.1s;
            font-size: 14px;
        }
        .tree-node:hover {
            background: #f0f4ff;
        }
        .tree-node.selected {
            background: #e1eaff;
            font-weight: 500;
        }
        .tree-indent {
            margin-left: 24px;
        }
        .modal-buttons {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-pack: end;
            -webkit-justify-content: flex-end;
            -ms-flex-pack: end;
            justify-content: flex-end;
            gap: 12px;
        }
        .modal-buttons button {
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
        }
        .modal-buttons .confirm {
            background: #1e6fdf;
            color: white;
        }
        .modal-buttons .cancel {
            background: #eef2f7;
        }
        .engine-list-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            -ms-flex-pack: justify;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            background: #fafcff;
        }
        .engine-name {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1;
            font-weight: 500;
        }
        .engine-actions {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            gap: 8px;
        }
        .engine-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .engine-actions button:hover {
            background: #e9ecef;
        }
        .add-engine-form {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e2e6ea;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
            gap: 10px;
        }
        .add-engine-form input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 14px;
        }
        .add-engine-form button {
            background: #1e6fdf;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px;
            cursor: pointer;
        }
        .sort-buttons {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            gap: 6px;
        }
        @-webkit-keyframes fadeIn {
            from { opacity: 0; -webkit-transform: scale(0.96); }
            to { opacity: 1; -webkit-transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 640px) {
            body { padding-top: 40px; }
            .action-bar { -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; -ms-flex-direction: column; flex-direction: column; -webkit-box-align: stretch; -webkit-align-items: stretch; -ms-flex-align: stretch; align-items: stretch; }
            .search-group { width: 100%; -webkit-box-pack: justify; -webkit-justify-content: space-between; -ms-flex-pack: justify; justify-content: space-between; }
            .search-group input { -webkit-box-flex: 1; -webkit-flex: 1; -ms-flex: 1; flex: 1; width: auto; }
            .tools-group { -webkit-box-pack: center; -webkit-justify-content: center; -ms-flex-pack: center; justify-content: center; }
            .grid { gap: 16px; }
            .card-title { font-size: 12px; width: 75px; }
        }
    </style>
</head>
<body>
<div class="nav-app">
    <div class="action-bar">
        <div class="search-group">
            <input type="text" id="searchInput" placeholder="搜索网站名称或URL..." autocomplete="off">
            <div class="search-btn-wrapper">
                <button class="search-btn" id="searchBtn">🔍 搜索 <span class="arrow">▼</span></button>
                <ul class="search-dropdown" id="searchDropdown"></ul>
            </div>
        </div>
        <div class="tools-group" id="toolsGroup">
            <button id="exportModuleBtn" class="primary">导出</button>
            <button id="importModuleBtn" class="warning">导入</button>
            <button id="addWebsiteBtn" style="background:#e8f0fe;">+网站</button>
            <button id="addFolderBtn" style="background:#fef5e7;">+文件夹</button>
            <button id="globalBackBtn" class="back-home-btn">返回主页</button>
        </div>
    </div>
    <div id="breadcrumbBar" class="breadcrumb-bar"></div>
    <div id="cardsGrid" class="grid"></div>
</div>
<script>
    let appData = { items: [] };
    let currentPath = [];
    let searchKeyword = "";
    // 【修改】默认搜索引擎设置为 Yandex
    let currentEngineId = "yandex";
    let mainSortable = null;
    let activeContextMenu = null;
    let sortMode = false;
    let exitSortBtn = null;

    // 【修改】搜索引擎列表：新增 Yandex 并放在最前面作为默认，原有的必应、谷歌、百度、搜狗依次下移
    let engineList = [
        { id: "yandex", name: "Yandex", url: "https://yandex.com/search/?text={q}" },
        { id: "bing", name: "必应", url: "https://www.bing.com/search?q={q}" },
        { id: "google", name: "谷歌", url: "https://www.google.com/search?q={q}" },
        { id: "baidu", name: "百度", url: "https://www.baidu.com/s?wd={q}" },
        { id: "sogou", name: "搜狗", url: "https://www.sogou.com/web?query={q}" }
    ];

    // 退出排序模式
    function exitSortMode() {
        sortMode = false;
        if (exitSortBtn) {
            exitSortBtn.remove();
            exitSortBtn = null;
        }
        initSortableForCurrentView();
        render();
    }

    function enterSortMode() {
        if (sortMode) return;
        sortMode = true;
        if (!exitSortBtn) {
            exitSortBtn = document.createElement('button');
            exitSortBtn.textContent = '✓ 完成排序';
            exitSortBtn.className = 'exit-sort-btn';
            exitSortBtn.onclick = exitSortMode;
            const toolsGroup = document.getElementById('toolsGroup');
            toolsGroup.appendChild(exitSortBtn);
        }
        initSortableForCurrentView();
        render();
    }

    function saveEnginesToLocal() {
        localStorage.setItem('nav_search_engines', JSON.stringify(engineList));
    }
    function loadEnginesFromLocal() {
        const saved = localStorage.getItem('nav_search_engines');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    engineList = parsed;
                }
            } catch(e) {}
        }
        // 确保 currentEngineId 有效，若无效则设为第一个
        if (!engineList.find(e => e.id === currentEngineId) && engineList.length) {
            currentEngineId = engineList[0].id;
        }
        renderSearchDropdown();
    }
    function renderSearchDropdown() {
        const dropdown = document.getElementById('searchDropdown');
        if (!dropdown) return;
        dropdown.innerHTML = '';
        engineList.forEach(engine => {
            const li = document.createElement('li');
            li.textContent = engine.name;
            li.dataset.id = engine.id;
            if (currentEngineId === engine.id) {
                li.classList.add('active');
            }
            li.addEventListener('click', function(e) {
                e.stopPropagation();
                currentEngineId = engine.id;
                renderSearchDropdown();
                const wrapper = document.querySelector('.search-btn-wrapper');
                const drop = document.getElementById('searchDropdown');
                drop.style.display = 'none';
                if (wrapper) wrapper.classList.remove('open');
                const inputEl = document.getElementById('searchInput');
                const keyword = inputEl.value.trim();
                if (keyword !== "") {
                    performSearchWithEngine(currentEngineId, keyword);
                }
            });
            dropdown.appendChild(li);
        });
        const divider = document.createElement('li');
        divider.className = 'divider';
        divider.style.pointerEvents = 'none';
        dropdown.appendChild(divider);
        const manageLi = document.createElement('li');
        manageLi.textContent = '⚙️ 管理搜索引擎';
        manageLi.className = 'manage';
        manageLi.addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('searchDropdown').style.display = 'none';
            var wrap = document.querySelector('.search-btn-wrapper');
            if (wrap) wrap.classList.remove('open');
            showEngineManager();
        });
        dropdown.appendChild(manageLi);
    }
    function performSearchWithEngine(engineId, keyword) {
        if (!keyword.trim()) return;
        const engine = engineList.find(function(e) { return e.id === engineId; });
        if (!engine) return;
        var searchUrl = engine.url;
        if (searchUrl.indexOf('{q}') > -1) {
            searchUrl = searchUrl.replace(/\{q\}/g, encodeURIComponent(keyword));
        } else {
            searchUrl = searchUrl + encodeURIComponent(keyword);
        }
        window.open(searchUrl, '_blank');
    }
    function performSearch() {
        const kw = document.getElementById('searchInput').value.trim();
        if (kw === "") return;
        performSearchWithEngine(currentEngineId, kw);
    }
    function showEngineManager() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-container" style="width: 460px;">
                <h3>🔧 管理搜索引擎</h3>
                <div id="engineManagerList" style="max-height: 320px; overflow-y: auto; margin-bottom: 16px;"></div>
                <div class="add-engine-form">
                    <input type="text" id="newEngineName" placeholder="引擎名称 (例: 360搜索)" />
